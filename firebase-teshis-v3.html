<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Teşhis v3</title>
<style>
  body{ font-family:-apple-system, sans-serif; background:#EEF3F3; color:#1D2A35; padding:20px; line-height:1.6; }
  #status{ background:#fff; border:1px solid #D9E2E2; border-radius:12px; padding:16px; white-space:pre-wrap; font-size:14px; }
  .ok{ color:#2E7D42; font-weight:800; }
  .fail{ color:#B4433A; font-weight:800; }
  .step{ color:#57707A; }
</style>
</head>
<body>
<h2>🔍 Firebase Teşhis v3 (GitHub Pages)</h2>
<div id="status"></div>

<script type="module">
  const el = document.getElementById("status");
  function log(msg, cls){
    const line = document.createElement("div");
    if(cls) line.className = cls;
    line.textContent = msg;
    el.appendChild(line);
  }

  const firebaseConfig = {
    apiKey: "AIzaSyBwwlyZsXC9tB2r5TYvQIqCqxCPr_-ITbk",
    authDomain: "calisan-bellek-egzersiz.firebaseapp.com",
    projectId: "calisan-bellek-egzersiz",
    storageBucket: "calisan-bellek-egzersiz.firebasestorage.app",
    messagingSenderId: "261598944722",
    appId: "1:261598944722:web:4c1af75ba3ef1513e37c0b",
    measurementId: "G-3YW5HN5JDH"
  };

  (async () => {
    try{
      log("1) firebase-app.js indiriliyor (gstatic)...", "step");
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js");
      log("1) ✓ indirildi", "ok");

      log("2) firebase-firestore.js indiriliyor (gstatic)...", "step");
      const { getFirestore, collection, addDoc, getDocs } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
      log("2) ✓ indirildi", "ok");

      log("3) initializeApp çağrılıyor...", "step");
      const app = initializeApp(firebaseConfig);
      log("3) ✓ tamamlandı", "ok");

      log("4) getFirestore çağrılıyor...", "step");
      const db = getFirestore(app);
      log("4) ✓ tamamlandı", "ok");

      log("5) Test kaydı yazılıyor...", "step");
      await addDoc(collection(db, "diagnostic"), { t: Date.now(), test: true, from: "github-pages" });
      log("5) ✓ Yazma başarılı!", "ok");

      log("6) Test kaydı okunuyor...", "step");
      const snap = await getDocs(collection(db, "diagnostic"));
      log(`6) ✓ Okuma başarılı! Koleksiyonda ${snap.size} belge var.`, "ok");

      log("", "");
      log("✅ TÜM ADIMLAR BAŞARILI!", "ok");
    }catch(e){
      log("", "");
      log("❌ HATA: " + (e && e.message ? e.message : String(e)), "fail");
      log("Ad: " + (e && e.name ? e.name : "-"), "fail");
      log("Detay: " + (e && e.stack ? e.stack : "(stack yok)"), "fail");
    }
  })();
</script>
</body>
</html>
